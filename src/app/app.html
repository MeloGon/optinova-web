<!-- Pantalla temporal para comprobar que Tailwind funciona.
     Se reemplaza en E1.4 por el router con los layouts reales. -->
<main class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <section class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="flex flex-col gap-4 text-center">
      <h1 class="text-2xl font-bold text-primary">{{ title() }}</h1>
      <p class="text-slate-600">Angular + Tailwind funcionando</p>
      <p class="text-slate-500">Clics: {{ clicks() }}</p>

      <button
        type="button"
        class="rounded-md bg-primary px-4 py-2 font-medium text-primary-foreground hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="addClick()"
      >
        Púlsame
      </button>

      <div class="flex justify-center gap-2" aria-label="Probar color primario">
        <button type="button" class="size-6 rounded-full bg-[oklch(0.62_0.17_165)]" (click)="setBrand('oklch(0.62 0.17 165)')" aria-label="Verde"></button>
        <button type="button" class="size-6 rounded-full bg-[oklch(0.55_0.2_260)]" (click)="setBrand('oklch(0.55 0.2 260)')" aria-label="Azul"></button>
        <button type="button" class="size-6 rounded-full bg-[oklch(0.55_0.22_300)]" (click)="setBrand('oklch(0.55 0.22 300)')" aria-label="Violeta"></button>
        <button type="button" class="size-6 rounded-full bg-[oklch(0.65_0.19_35)]" (click)="setBrand('oklch(0.65 0.19 35)')" aria-label="Coral"></button>
      </div>
    </div>
  </section>
</main>
