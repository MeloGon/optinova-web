<ol class="flex items-center" aria-label="Pasos">
  @for (step of steps(); track $index; let last = $last) {
    <li class="flex items-center" [class.flex-1]="!last" [attr.aria-current]="step.state === 'current' ? 'step' : null">
      <button
        type="button"
        (click)="onClick($index, step.state)"
        [disabled]="step.state !== 'complete'"
        class="flex shrink-0 items-center gap-2.5 rounded-sm text-left disabled:cursor-default"
      >
        <span class="grid size-8 shrink-0 place-items-center rounded-full text-[13px] font-semibold tabular-nums" [class]="dotClasses(step.state)">
          @if (step.state === 'complete') {
            <svg [lucideIcon]="checkIcon" [size]="15"></svg>
          } @else if (step.state === 'error') {
            <svg [lucideIcon]="errorIcon" [size]="15"></svg>
          } @else {
            {{ $index + 1 }}
          }
        </span>
        <span class="hidden flex-col sm:flex">
          <span class="text-[14px]" [class.font-semibold]="step.state === 'current'" [class.font-medium]="step.state !== 'current'">{{
            step.label
          }}</span>
          <span class="max-w-40 truncate text-[12px] text-muted-foreground">{{ step.hint }}</span>
        </span>
      </button>
      @if (!last) {
        <span class="mx-2 hidden h-px flex-1 sm:block" [class]="barClasses(step.state)"></span>
      }
    </li>
  }
</ol>
<p class="mt-2 text-body-sm text-muted-foreground sm:hidden">
  Paso {{ current() }} de {{ steps().length }} · {{ steps()[current() - 1]?.hint }}
</p>
