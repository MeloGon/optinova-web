<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-5">
  <div>
    <span
      aria-hidden="true"
      class="mb-5 grid size-12 place-items-center rounded-md border-[1.5px] border-dashed border-border-strong"
    >
      <span class="size-2.5 rounded-full border-2 border-primary ring-3 ring-primary-subtle"></span>
    </span>
    <h1 class="text-title">Inicia sesión</h1>
    <p class="mt-1 text-body text-muted-foreground">Usa el correo que te dio tu administrador.</p>
  </div>

  <!-- Campos con estilo provisional: se reemplazan por C-02 Input cuando se construya. -->
  <div class="flex flex-col gap-1.5">
    <label for="email" class="text-label">Correo electrónico</label>
    <div
      class="flex h-(--onv-control-h) items-center gap-2 rounded-md border bg-input-background px-3 focus-within:outline-2"
      [class]="emailError() ? 'border-danger focus-within:outline-danger' : 'border-input focus-within:outline-ring'"
    >
      <svg [lucideIcon]="icons.mail" [size]="16" class="shrink-0 text-muted-foreground"></svg>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="nombre@optinova.pe"
        [attr.aria-invalid]="!!emailError()"
        aria-describedby="email-error"
        (input)="store.clearError()"
        class="min-w-0 flex-1 bg-transparent text-body outline-none placeholder:text-muted-foreground"
      />
    </div>
    @if (emailError(); as e) {
      <p id="email-error" class="text-body-sm text-danger-subtle-foreground">{{ e }}</p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="password" class="text-label">Contraseña</label>
    <div
      class="flex h-(--onv-control-h) items-center gap-2 rounded-md border bg-input-background pr-1 pl-3 focus-within:outline-2"
      [class]="passwordError() ? 'border-danger focus-within:outline-danger' : 'border-input focus-within:outline-ring'"
    >
      <svg [lucideIcon]="icons.lock" [size]="16" class="shrink-0 text-muted-foreground"></svg>
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="!!passwordError()"
        aria-describedby="password-error"
        (input)="store.clearError()"
        class="min-w-0 flex-1 bg-transparent text-body outline-none"
      />
      <button
        type="button"
        (click)="showPassword.update((v) => !v)"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        class="grid size-[26px] place-items-center rounded-sm text-muted-foreground hover:bg-muted"
      >
        <svg [lucideIcon]="showPassword() ? icons.eyeOff : icons.eye" [size]="16"></svg>
      </button>
    </div>
    @if (passwordError(); as e) {
      <p id="password-error" class="text-body-sm text-danger-subtle-foreground">{{ e }}</p>
    }
  </div>

  @if (store.error(); as e) {
    <div role="alert" class="flex items-start gap-2 rounded-md bg-danger-subtle px-3 py-2.5 text-body text-danger-subtle-foreground">
      <svg [lucideIcon]="icons.alert" [size]="16" class="mt-0.5 shrink-0"></svg>
      <span>{{ e }}</span>
    </div>
  }

  <button
    type="submit"
    [disabled]="store.loading()"
    class="inline-flex h-(--size-control-lg) w-full items-center justify-center gap-2 rounded-md bg-primary px-4 text-[14px] font-medium text-primary-foreground hover:bg-primary-hover active:bg-primary-active disabled:cursor-wait disabled:opacity-70"
  >
    @if (store.loading()) {
      <span class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent" aria-hidden="true"></span>
      Ingresando…
    } @else {
      Ingresar
      <svg [lucideIcon]="icons.arrow" [size]="16"></svg>
    }
  </button>
</form>
