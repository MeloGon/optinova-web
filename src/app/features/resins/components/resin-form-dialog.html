<form [formGroup]="form" (submit)="$event.preventDefault(); submit()" novalidate>
  <div class="border-b border-border px-6 py-4">
    <h2 [id]="titleId" class="text-heading">{{ isEditing ? 'Editar resina' : 'Nueva resina' }}</h2>
  </div>

  <div class="flex max-h-[calc(100dvh-14rem)] flex-col gap-4 overflow-y-auto p-6">
    <onv-field label="Descripción" inputId="resin-description" [required]="true" [errors]="{ required: 'Describe la resina.' }">
      <input id="resin-description" onvInput formControlName="description" placeholder="Ej. Monofocal antirreflejante" />
    </onv-field>

    <div class="grid grid-cols-2 gap-4">
      <onv-field label="Diseño" inputId="resin-design">
        <input id="resin-design" onvInput formControlName="design" placeholder="Ej. Monofocal" />
      </onv-field>
      <onv-field label="Línea" inputId="resin-line">
        <input id="resin-line" onvInput formControlName="line" placeholder="Ej. Estándar" />
      </onv-field>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <onv-field label="Material" inputId="resin-material">
        <input id="resin-material" onvInput formControlName="material" placeholder="Ej. CR-39" />
      </onv-field>
      <onv-field label="Tecnología" inputId="resin-technology">
        <input id="resin-technology" onvInput formControlName="technology" placeholder="Ej. Antirreflejante" />
      </onv-field>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <onv-field label="Precio" inputId="resin-price" [required]="true" [errors]="{ required: 'Ingresa un precio.', min: 'Debe ser 0 o más.' }">
        <input id="resin-price" type="number" onvInput formControlName="price" step="0.01" min="0" placeholder="0.00" />
      </onv-field>
      <onv-field label="Precio interno" inputId="resin-price-internal" [errors]="{ min: 'Debe ser 0 o más.' }">
        <input id="resin-price-internal" type="number" onvInput formControlName="priceInternal" step="0.01" min="0" placeholder="0.00" />
      </onv-field>
      <onv-field label="Cantidad" inputId="resin-quantity" [required]="true" [errors]="{ required: 'Ingresa la cantidad.', min: 'Debe ser 0 o más.' }">
        <input id="resin-quantity" type="number" onvInput formControlName="quantity" step="1" min="0" placeholder="0" />
      </onv-field>
    </div>

    @if (error(); as message) {
      <div role="alert" class="flex items-start gap-2 rounded-md bg-danger-subtle px-3 py-2.5 text-body text-danger-subtle-foreground">
        <svg [lucideIcon]="alertIcon" [size]="16" class="mt-0.5 shrink-0"></svg>
        <span>{{ message }}</span>
      </div>
    }
  </div>

  <div class="flex justify-end gap-2 rounded-b-xl border-t border-border bg-background px-6 py-3">
    <button
      type="button"
      (click)="cancel()"
      class="inline-flex h-(--onv-control-h) items-center rounded-md px-4 text-[14px] font-medium hover:bg-muted"
    >
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="saving()"
      class="inline-flex h-(--onv-control-h) items-center gap-2 rounded-md bg-primary px-4 text-[14px] font-medium text-primary-foreground hover:bg-primary-hover active:bg-primary-active disabled:cursor-wait disabled:opacity-70"
    >
      @if (saving()) {
        <span class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent" aria-hidden="true"></span>
        Guardando…
      } @else {
        {{ isEditing ? 'Guardar cambios' : 'Registrar' }}
      }
    </button>
  </div>
</form>
