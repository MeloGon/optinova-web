<form [formGroup]="form" (submit)="$event.preventDefault(); submit()" novalidate>
  <div class="border-b border-border px-6 py-4">
    <h2 [id]="titleId" class="text-heading">Editar paciente</h2>
    <p class="text-body-sm text-muted-foreground">{{ patient.name }}</p>
  </div>

  <div class="flex max-h-[calc(100dvh-14rem)] flex-col gap-4 overflow-y-auto p-6">
    <onv-field label="Apellidos y nombres" inputId="patient-name" [required]="true" [errors]="{ required: 'Escribe el nombre del paciente.' }">
      <input id="patient-name" onvInput formControlName="name" autocomplete="off" />
    </onv-field>

    <div class="grid gap-4 sm:grid-cols-2">
      <onv-field label="Teléfono" inputId="patient-phone">
        <input id="patient-phone" onvInput formControlName="phone" inputmode="tel" autocomplete="off" />
      </onv-field>
      <onv-field label="Teléfono secundario" inputId="patient-phone-2">
        <input id="patient-phone-2" onvInput formControlName="secondaryPhone" inputmode="tel" autocomplete="off" />
      </onv-field>
    </div>

    <div class="grid gap-4 sm:grid-cols-3">
      <onv-field label="Género" inputId="patient-gender">
        <!-- Select nativo con estilo provisional: se reemplaza por C-03 cuando se necesite buscar. -->
        <select id="patient-gender" onvInput formControlName="gender">
          <option value="">Sin especificar</option>
          @for (gender of genders; track gender) {
            <option [value]="gender">{{ gender }}</option>
          }
        </select>
      </onv-field>

      <onv-field label="Fecha de nacimiento" inputId="patient-birth" [errors]="{ future: 'No puede ser una fecha futura.' }">
        <!-- Date nativo con estilo provisional: se reemplaza por C-04. Entrega yyyy-MM-dd, el formato de la DB. -->
        <input id="patient-birth" type="date" onvInput formControlName="birthDate" min="1900-01-01" [max]="today" />
      </onv-field>

      <onv-field label="Sucursal" inputId="patient-branch" [required]="true" [errors]="{ required: 'Elige una sucursal.' }">
        <select id="patient-branch" onvInput formControlName="branch">
          @if (!patient.branch) {
            <option value="" disabled>Seleccione</option>
          }
          @for (branch of branches(); track branch.value) {
            <option [value]="branch.value">{{ branch.label }}{{ branch.active ? '' : ' (cerrada)' }}</option>
          }
        </select>
      </onv-field>
    </div>

    <onv-field label="Observaciones" inputId="patient-notes">
      <textarea id="patient-notes" onvInput formControlName="observations" rows="3"></textarea>
    </onv-field>

    @if (error(); as message) {
      <div role="alert" class="flex items-start gap-2 rounded-md bg-danger-subtle px-3 py-2.5 text-body text-danger-subtle-foreground">
        <svg [lucideIcon]="alertIcon" [size]="16" class="mt-0.5 shrink-0"></svg>
        <span>{{ message }}</span>
      </div>
    }
  </div>

  <div class="flex justify-end gap-2 rounded-b-xl border-t border-border bg-background px-6 py-3">
    <button
      type="button"
      (click)="cancel()"
      class="inline-flex h-(--onv-control-h) items-center rounded-md px-4 text-[14px] font-medium hover:bg-muted"
    >
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="saving()"
      class="inline-flex h-(--onv-control-h) items-center gap-2 rounded-md bg-primary px-4 text-[14px] font-medium text-primary-foreground hover:bg-primary-hover active:bg-primary-active disabled:cursor-wait disabled:opacity-70"
    >
      @if (saving()) {
        <span class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent" aria-hidden="true"></span>
        Guardando…
      } @else {
        Guardar cambios
      }
    </button>
  </div>
</form>
