<div class="border-b border-border px-6 py-4">
  <h2 [id]="titleId" class="text-heading">Gestionar categorías</h2>
</div>

<div class="flex max-h-[calc(100dvh-14rem)] flex-col gap-3 overflow-y-auto p-6">
  @if (categories().length === 0) {
    <p class="text-body-sm text-muted-foreground">No hay categorías. Agrega una a continuación.</p>
  } @else {
    @for (category of categories(); track category.id) {
      <div class="flex items-center gap-2.5 rounded-md border border-border bg-muted/40 px-3 py-2.5">
        <span aria-hidden="true" class="size-3 shrink-0 rounded-full" [style.background-color]="category.color"></span>
        <span class="flex-1 truncate text-[13px] font-medium">{{ category.name }}</span>
        <button
          type="button"
          (click)="deleteCategory(category)"
          [attr.aria-label]="'Eliminar ' + category.name"
          class="grid size-7 shrink-0 place-items-center rounded-sm text-danger-subtle-foreground hover:bg-danger-subtle"
        >
          <svg [lucideIcon]="trashIcon" [size]="15"></svg>
        </button>
      </div>
    }
  }

  <div class="h-px bg-border"></div>

  @if (!showForm()) {
    <button
      type="button"
      (click)="openForm()"
      class="inline-flex h-8 w-fit items-center gap-1.5 rounded-md border border-border-strong px-3 text-[13px] font-medium hover:bg-muted"
    >
      Nueva categoría
    </button>
  } @else {
    <form [formGroup]="form" (submit)="$event.preventDefault(); addCategory()" novalidate class="flex flex-col gap-3">
      <onv-field label="Nombre" inputId="category-name" [required]="true" [errors]="{ required: 'Escribe un nombre.' }">
        <input id="category-name" onvInput formControlName="name" placeholder="Ej. Servicios externos" />
      </onv-field>

      <div class="flex flex-col gap-1.5">
        <span class="text-label">Color</span>
        <div class="flex flex-wrap gap-2">
          @for (color of presetColors; track color) {
            <button
              type="button"
              (click)="pickColor(color)"
              [attr.aria-label]="'Color ' + color"
              [attr.aria-pressed]="selectedColor() === color"
              class="size-7 rounded-full ring-offset-2 outline-none"
              [class.ring-2]="selectedColor() === color"
              [class.ring-foreground]="selectedColor() === color"
              [style.background-color]="color"
            ></button>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="cancelForm()"
          class="inline-flex h-8 items-center rounded-md px-3 text-[13px] font-medium hover:bg-muted"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="inline-flex h-8 items-center rounded-md bg-primary px-3 text-[13px] font-medium text-primary-foreground hover:bg-primary-hover disabled:cursor-wait disabled:opacity-70"
        >
          Agregar
        </button>
      </div>
    </form>
  }
</div>

<div class="flex justify-end rounded-b-xl border-t border-border bg-background px-6 py-3">
  <button
    type="button"
    (click)="close()"
    class="inline-flex h-(--onv-control-h) items-center rounded-md border border-border-strong px-4 text-[14px] font-medium hover:bg-muted"
  >
    Cerrar
  </button>
</div>
